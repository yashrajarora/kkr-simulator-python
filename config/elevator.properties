# Settings for the elevator simulator. Read from the config folder at startup.
# Required: requests, strategy, mode.

# Request file, in the data folder
requests=requests.csv

# Assignment strategy:
# ROUND_ROBIN,
# NEAREST_CAR,
# NEAREST_CAR_FORWARD_RUN
# NEAREST_CAR_SIMPLE
# COST_BASED, BALANCED_STRATEGY,
# or ALL (runs every strategy in turn)
strategy=COST_BASED

# Traffic mode: NORMAL, MORNING_RUSH, LUNCH_OUT_RUSH, LUNCH_BACK_RUSH, or EVENING_RUSH
mode=NORMAL

# Building and cars. Defaults: floors 50, cars 6 (all regular), capacity 10
floors=50
cars=6
capacity=10

# Optional per-car settings (car numbers start at 1)
# startFloor.1=1
#parkingFloor.1=3
#parkingFloor.2=10
# express.2=1,5,6
#express.7=1,45,46,47,48,49,50
#express.8=1,45,46,47,48,49,50
#parkingFloor.7=45
#parkingFloor.8=45