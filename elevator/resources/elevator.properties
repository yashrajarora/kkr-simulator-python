# Settings for the elevator simulator. Read from the elevator/resources folder at startup.
# Required: requests, strategy, mode.

# Request file, in this resources folder
requests=sample_best_balanced_strategy.csv

# Assignment algorithm: ROUND_ROBIN, NEAREST_CAR (FR-ASN-4b, floor distance with direction),
# NEAREST_CAR_FORWARD_RUN (FR-ASN-4b, simulated pickup time), NEAREST_CAR_SIMPLE (floor distance, comparison only),
# COST_BASED, BALANCED_STRATEGY (FR-ASN-4d), or ALL (runs every strategy in turn)
strategy=BALANCED_STRATEGY

# Traffic mode: NORMAL, MORNING_RUSH, LUNCH_OUT_RUSH, LUNCH_BACK_RUSH, or EVENING_RUSH
mode=NORMAL

# Building and cars. Defaults: floors 50, cars 6 (all regular), capacity 10
floors=10
cars=2
capacity=2

# Optional per-car settings (car numbers start at 1)
# startFloor.1=1
#parkingFloor.1=3
#parkingFloor.2=10
# express.2=1,5,6
#express.7=1,45,46,47,48,49,50
#express.8=1,45,46,47,48,49,50
#parkingFloor.7=45
#parkingFloor.8=45